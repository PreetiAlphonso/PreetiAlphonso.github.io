<body>

  <!-- NAV -->
  <nav style="background:#fff; border-bottom:1px solid #e7e5e4;">
    <div class="nav-inner" style="max-width:900px; margin:0 auto; padding:24px 32px; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-size:22px; font-weight:300; letter-spacing:1px; color:#1c1917;">Preeti Alphonso</div>
      <div class="nav-links" style="display:flex; align-items:center; gap:32px;">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="index.html#cases" class="nav-link">Case Studies</a>
        <a href="index.html#ai" class="nav-link">Tech &amp; AI</a>
        <a href="innovation.html" class="nav-link active">Innovation</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
        <a href="https://linkedin.com/in/preetialphonso" target="_blank" style="color:#78716c;">
          <svg style="width:20px;height:20px;" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
          </svg>
        </a>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ── DEMO DATA ────────────────────────────────────────────────────────
    const DEMO_ROS = `# Q2 Executive Dinner — Run of Show (Internal)

## 1. EVENT HEADER
| Field | Details |
|---|---|
| Event | Q2 Executive Dinner |
| Date | May 15, 2025 |
| Venue | The Capital Grille, Boston |
| Guest Arrival | 6:30 PM |
| Event Owner | Sarah Mitchell |
| Producer | Encore Productions |
| Goal | Accelerate 3 enterprise deals and deepen key account relationships |

## 2. KEY CONTACTS SHEET
| Role | Name | Contact | Backup |
|---|---|---|---|
| Event Owner | Sarah Mitchell | On-site | VP Marketing |
| Venue Coordinator | Mark Lee | 617-555-0101 | Venue Manager |
| AV Lead | TechPro | 617-555-0202 | On-site tech |
| Catering | Chef Rosa | 617-555-0303 | Sous Chef |

## 3. DAY-OF TIMELINE
| Time | Duration | Activity | Owner | Notes/Cues |
|---|---|---|---|---|
| 5:30 PM | 60 min | Registration & Staff Briefing | Sarah Mitchell | Confirm AV, seating, name badges |
| 6:30 PM | 40 min | Guest Arrival & Networking | Host | Welcome drinks, light passed apps |
| 7:10 PM | 5 min | Transition to Seating | Emcee | Soft chime cue, dim lighting |
| 7:15 PM | 5 min | Welcome Remarks | Sarah Mitchell | Sets tone, introduces speaker |
| 7:20 PM | 35 min | Keynote: AI-Powered Field Marketing | Preeti Alphonso | Live demo of 3-Tier Agentic Platform |
| 7:55 PM | 5 min | Q&A | Preeti Alphonso | 2-3 curated questions ready |
| 8:00 PM | 45 min | Dinner & Roundtable Conversations | All | Sales team circulates to target accounts |
| 8:45 PM | 10 min | Closing Remarks & CTA | Sarah Mitchell | Next steps, survey QR code displayed |
| 8:55 PM | — | Guest Departure | Staff | Gift bags at exit |

## 4. CONTINGENCY / WEATHER PLAN
Indoor backup confirmed at The Capital Grille private dining room.
If 3+ cancellations day-of: compress agenda by 20 mins, remove roundtable, go straight to dinner.
AV backup laptop pre-loaded with keynote slides.

## 5. BUDGET SNAPSHOT
| Category | Budgeted | Notes |
|---|---|---|
| Venue | $5,000 | Includes room fee & setup |
| Catering | $4,000 | 3-course dinner, wine pairing |
| AV | $1,500 | Microphone, screen, lighting |
| Misc | $1,500 | Gifts, printing, contingency |
| TOTAL | $12,000 | Within approved budget |

## 6. POST-EVENT ACTIONS
- Google Forms survey sent within 24 hrs (QR code displayed at event close)
- Debrief: May 19, 2025 @ 10:00 AM EST with Sarah Mitchell & Encore Productions
- Follow-up owner: Sarah Mitchell — personalized outreach to all attendees within 48 hrs
- Pipeline update: Sales team logs deal acceleration notes in Salesforce by May 20`;

    const DEMO_AGENDA = `# Q2 Executive Dinner
### May 15, 2025 · The Capital Grille, Boston

---

Dear Valued Guest,

It is my pleasure to welcome you to this exclusive evening designed for leaders who are shaping the future of enterprise marketing. Tonight is about meaningful conversation, fresh thinking, and the relationships that drive great outcomes.

Warmly,
Sarah Mitchell, VP Field Marketing

---

## Evening Program

6:30 PM — Arrival & Networking Reception
Welcome drinks and light appetizers as you connect with fellow marketing and revenue leaders

7:15 PM — Welcome Remarks
Sarah Mitchell, VP Field Marketing

7:20 PM — Featured Keynote
AI-Powered Field Marketing: The Future of Revenue Growth
Preeti Alphonso, Founder — Go-To-Marketology

A live demonstration of the 3-Tier Agentic Platform — AI agents working in real time to plan, execute, and validate field marketing programs.

8:00 PM — Executive Dinner & Roundtable
An intimate dinner conversation exploring how AI is transforming go-to-market strategy

8:45 PM — Closing & Next Steps

---
We look forward to an exceptional evening together.`;

    const DEMO_SURVEY = `# Post-Event Survey — Q2 Executive Dinner

| Question | Type | Options |
|---|---|---|
| How would you rate tonight's overall experience? | Rating | 1-5 stars |
| How relevant was the keynote to your current priorities? | Rating | 1-5 stars |
| What was your single biggest takeaway from Preeti's presentation? | Open text | — |
| How would you rate the venue and logistics? | Rating | 1-5 stars |
| How valuable was the networking opportunity tonight? | Rating | 1-5 stars |
| Are you interested in a follow-up conversation? | Single select | Yes / Maybe / Not at this time |
| How likely are you to attend a future event? | Rating | 1-5 stars |
| Would you recommend this event series to a colleague? (NPS) | Rating | 0-10 |
| What topics would you like covered at future events? | Multi-select | ABM / AI Tools / Revenue Ops / Partner Marketing / Other |
| Any additional feedback for the team? | Open text | — |`;

    // ── HELPERS ──────────────────────────────────────────────────────────
    const addMins = (time, mins) => {
      const isPM = time.includes("PM");
      const [h, m] = time.replace(/ (AM|PM)/, "").split(":").map(Number);
      let total = (isPM && h !== 12 ? h + 12 : h) * 60 + m + mins;
      const hh = Math.floor(total / 60) % 24;
      const mm = total % 60;
      return `${hh % 12 || 12}:${mm.toString().padStart(2, "0")} ${hh >= 12 ? "PM" : "AM"}`;
    };

    const DEFAULT_BUDGET = [
      { id: 1, category: "Venue", amount: "5000" },
      { id: 2, category: "Catering", amount: "4000" },
      { id: 3, category: "AV", amount: "1500" },
      { id: 4, category: "Misc", amount: "1500" },
    ];

    const DEFAULTS = {
      eventName: "Q2 Executive Dinner",
      date: "May 15, 2025",
      venue: "The Capital Grille, Boston",
      guestArrival: "6:30 PM",
      host: "Sarah Mitchell, VP Field Marketing",
      speaker: "Preeti Alphonso, Founder — Go-To-Marketology",
      speakerTopic: "AI-Powered Field Marketing: The Future of Revenue Growth",
      goal: "Accelerate 3 enterprise deals and deepen key account relationships",
      eventOwner: "Sarah Mitchell",
      producer: "Encore Productions",
      debriefDate: "May 19, 2025 @ 10:00 AM EST",
      contacts: "Venue: Mark Lee 617-555-0101 | AV: TechPro 617-555-0202 | Catering: Chef Rosa 617-555-0303",
      contingency: "Indoor backup confirmed. If 3+ cancellations day-of, compress agenda by 20 mins.",
      additionalContext: "Keynote will walk through Go-To-Marketology's 3-Tier Agentic Platform for Field Marketers — a live demonstration of AI agents working in real time to plan, execute, and validate field marketing programs.",
    };

    const iStyle = { width: "100%", padding: "5px 8px", border: "1px solid #d6d3d1", borderRadius: 6, fontSize: 12, boxSizing: "border-box", fontFamily: "system-ui" };

    // ── PIPELINE ─────────────────────────────────────────────────────────
    function Pipeline({ onBack }) {
      const [inp, setInp] = useState(DEFAULTS);
      const [budget, setBudget] = useState(DEFAULT_BUDGET);
      const [phase, setPhase] = useState("idle");
      const [ros, setRos] = useState({ draft: "", review: null, final: "" });
      const [suite, setSuite] = useState({ agenda: "", survey: "" });
      const [tab, setTab] = useState("ros");

      const set = (k, v) => setInp(p => ({ ...p, [k]: v }));
      const busy = phase === "ros_running" || phase === "suite_running";
      const reg = addMins(inp.guestArrival, -60);
      const netEnd = addMins(inp.guestArrival, 40);
      const seat = addMins(inp.guestArrival, 45);
      const keynote = addMins(inp.guestArrival, 50);
      const totalBudget = budget.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);

      const runRoS = async () => {
        setPhase("ros_running");
        await new Promise(r => setTimeout(r, 800));
        setRos(p => ({ ...p, draft: DEMO_ROS }));
        await new Promise(r => setTimeout(r, 700));
        setRos(p => ({ ...p, review: { verdict: "PASS", issues: [] } }));
        await new Promise(r => setTimeout(r, 500));
        setRos(p => ({ ...p, final: DEMO_ROS }));
        setPhase("ros_done"); setTab("ros");
      };

      const runSuite = async () => {
        setPhase("suite_running");
        await new Promise(r => setTimeout(r, 1000));
        setSuite({ agenda: DEMO_AGENDA, survey: DEMO_SURVEY });
        setPhase("suite_done"); setTab("agenda");
      };

      const agentSteps = [
        { label: "Agent 1", sub: "Draft RoS", done: !!ros.draft },
        { label: "Agent 2", sub: "Review", done: !!ros.review },
        { label: "Agent 3", sub: "Validate", done: ["ros_done","suite_running","suite_done"].includes(phase) },
      ];
      const showTabs = ["ros_done","suite_running","suite_done"].includes(phase);

      const Btn = ({ onClick, children, disabled }) => (
        <button onClick={onClick} disabled={disabled} style={{
          padding: "9px 16px", background: "#fff", color: "#b45309",
          border: "2px solid #b45309", borderRadius: 7,
          cursor: disabled ? "not-allowed" : "pointer",
          fontSize: 13, fontWeight: 600, opacity: disabled ? 0.6 : 1
        }}>{children}</button>
      );

      return (
        <div style={{ fontFamily: "system-ui", fontSize: 14 }}>
          <button onClick={onBack} style={{ background: "none", border: "none", color: "#b45309", cursor: "pointer", fontSize: 13, marginBottom: 16, padding: 0 }}>
            ← Back to Innovation
          </button>

          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
            <span style={{ background: "#fef9f0", border: "1px solid #e7e5e4", color: "#b45309", padding: "4px 12px", borderRadius: 20, fontSize: 12, fontWeight: 600 }}>
              ⚡ Live Demo Mode
            </span>
            <span style={{ fontSize: 12, color: "#78716c" }}>Pre-loaded sample outputs — no API calls made</span>
          </div>

          <div style={{ background: "#fef9f0", border: "1px solid #e7e5e4", borderRadius: 10, padding: "16px 20px", marginBottom: 20 }}>
            <h2 style={{ margin: 0, fontSize: 18, color: "#1c1917" }}>🎯 Event Document Suite Pipeline</h2>
            <p style={{ margin: "4px 0 0", fontSize: 12, color: "#78716c" }}>Executive Dinner · Evening · &lt;50 Guests · 3-Agent Workflow</p>
          </div>

          <div style={{ background: "#fafaf9", border: "1px solid #e7e5e4", borderRadius: 10, padding: 16, marginBottom: 16 }}>
            <strong style={{ fontSize: 13, color: "#292524" }}>📋 Event Details</strong>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
              {[["eventName","Event Name"],["date","Date"],["venue","Venue"],["guestArrival","Guest Arrival Time"],
                ["eventOwner","Event Owner"],["producer","Producer"],["host","Host / Emcee"],
                ["speaker","Speaker"],["speakerTopic","Speaker Topic"],["debriefDate","Debrief Date"]
              ].map(([k, l]) => (
                <div key={k}>
                  <div style={{ fontSize: 11, color: "#78716c", marginBottom: 2 }}>{l}</div>
                  <input value={inp[k]} onChange={e => set(k, e.target.value)} disabled={busy} style={iStyle} />
                </div>
              ))}
            </div>
            {[["goal","Event Goal"],["contacts","Key Contacts"],["contingency","Contingency Plan"]].map(([k, l]) => (
              <div key={k} style={{ marginTop: 8 }}>
                <div style={{ fontSize: 11, color: "#78716c", marginBottom: 2 }}>{l}</div>
                <input value={inp[k]} onChange={e => set(k, e.target.value)} disabled={busy} style={iStyle} />
              </div>
            ))}

            <div style={{ marginTop: 12, background: "#fff", border: "1px solid #e7e5e4", borderRadius: 8, padding: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <strong style={{ fontSize: 12 }}>💰 Budget Breakdown</strong>
                <span style={{ fontSize: 12, fontWeight: 700, color: "#b45309" }}>Total: ${totalBudget.toLocaleString()}</span>
              </div>
              {budget.map(b => (
                <div key={b.id} style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "center" }}>
                  <input value={b.category} onChange={e => setBudget(p => p.map(x => x.id === b.id ? { ...x, category: e.target.value } : x))}
                    placeholder="Category" disabled={busy} style={{ ...iStyle, flex: 2 }} />
                  <div style={{ position: "relative", flex: 1 }}>
                    <span style={{ position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)", fontSize: 12, color: "#78716c" }}>$</span>
                    <input value={b.amount} onChange={e => setBudget(p => p.map(x => x.id === b.id ? { ...x, amount: e.target.value } : x))}
                      placeholder="0" type="number" disabled={busy} style={{ ...iStyle, paddingLeft: 18 }} />
                  </div>
                  {budget.length > 1 && (
                    <button onClick={() => setBudget(p => p.filter(x => x.id !== b.id))} disabled={busy}
                      style={{ background: "none", border: "1px solid #fca5a5", color: "#ef4444", borderRadius: 6, padding: "4px 8px", cursor: "pointer", fontSize: 13 }}>✕</button>
                  )}
                </div>
              ))}
              <button onClick={() => setBudget(p => [...p, { id: Date.now(), category: "", amount: "" }])} disabled={busy}
                style={{ marginTop: 4, padding: "5px 12px", background: "#f5f5f4", border: "1px dashed #a8a29e", borderRadius: 6, cursor: "pointer", fontSize: 12, color: "#57534e" }}>
                + Add Budget Item
              </button>
            </div>

            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 11, color: "#b45309", marginBottom: 2, fontWeight: 600 }}>⭐ Additional Context — taglines, VIP names, product announcements, theme...</div>
              <textarea value={inp.additionalContext} onChange={e => set("additionalContext", e.target.value)} disabled={busy} rows={3}
                style={{ width: "100%", padding: "6px 8px", border: "1px solid #d6b896", borderRadius: 6, fontSize: 12, boxSizing: "border-box", resize: "vertical", fontFamily: "system-ui" }} />
            </div>

            <div style={{ marginTop: 10, background: "#fef9f0", border: "1px solid #fcd34d", borderRadius: 6, padding: "8px 12px", fontSize: 12, color: "#92400e" }}>
              ⏱️ Registration: <b>{reg}</b> · Networking: <b>{inp.guestArrival}–{netEnd}</b> · Seating: <b>{seat}</b> · Keynote: <b>{keynote}</b>
            </div>
          </div>

          <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
            {phase === "idle" && <Btn onClick={runRoS}>🚀 Phase 1 — Generate Run of Show</Btn>}
            {phase === "ros_done" && <>
              <Btn onClick={runSuite}>✅ Approve &amp; Generate Guest Agenda + Survey</Btn>
              <Btn onClick={() => { setPhase("idle"); setRos({ draft: "", review: null, final: "" }); }}>🔄 Regenerate</Btn>
            </>}
            {phase === "suite_done" && <Btn onClick={() => { setPhase("idle"); setRos({ draft: "", review: null, final: "" }); setSuite({ agenda: "", survey: "" }); }}>🔄 Start Over</Btn>}
          </div>

          {phase !== "idle" && (
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              {agentSteps.map((a, i) => {
                const active = !a.done && (
                  (i === 0 && phase === "ros_running" && !ros.draft) ||
                  (i === 1 && phase === "ros_running" && !!ros.draft && !ros.review) ||
                  (i === 2 && phase === "ros_running" && !!ros.review)
                );
                return (
                  <div key={i} style={{ flex: 1, textAlign: "center", padding: "8px 4px", borderRadius: 8, fontSize: 12, border: "1px solid",
                    background: a.done ? "#f0fdf4" : active ? "#fef9f0" : "#fafaf9",
                    borderColor: a.done ? "#86efac" : active ? "#fcd34d" : "#e7e5e4",
                    color: a.done ? "#15803d" : active ? "#92400e" : "#a8a29e" }}>
                    <div style={{ fontWeight: 700 }}>{a.done ? "✅" : active ? "⏳" : "○"} {a.label}</div>
                    <div>{a.sub}</div>
                  </div>
                );
              })}
            </div>
          )}

          {ros.review && (
            <div style={{ marginBottom: 14, padding: 12, borderRadius: 8, border: "1px solid #bbf7d0", background: "#f0fdf4", fontSize: 13 }}>
              <strong>🔍 Agent 2 — ✅ All checks passed</strong>
            </div>
          )}

          {phase === "suite_running" && (
            <div style={{ padding: 12, background: "#fef9f0", border: "1px solid #fcd34d", borderRadius: 8, color: "#92400e", fontSize: 13, marginBottom: 14 }}>
              ⚡ Generating Guest Agenda &amp; Post-Event Survey simultaneously...
            </div>
          )}

          {showTabs && (
            <div>
              <div style={{ display: "flex", gap: 4 }}>
                {[["ros","📋 Run of Show", true], ["agenda","📄 Guest Agenda", phase === "suite_done"], ["survey","📊 Survey", phase === "suite_done"]]
                  .filter(([,,s]) => s)
                  .map(([key, label]) => (
                  <button key={key} onClick={() => setTab(key)} style={{
                    padding: "7px 14px", borderRadius: "7px 7px 0 0", border: "1px solid", cursor: "pointer", fontSize: 12, fontWeight: 600,
                    background: tab === key ? "#44403c" : "#f5f5f4",
                    color: tab === key ? "#fff" : "#57534e",
                    borderColor: tab === key ? "#44403c" : "#e7e5e4",
                  }}>{label}</button>
                ))}
              </div>
              <div style={{ border: "1px solid #e7e5e4", borderRadius: "0 8px 8px 8px", padding: 16, background: "#fff" }}>
                {tab === "ros" && ros.final && <pre style={{ margin: 0, fontSize: 11, whiteSpace: "pre-wrap", fontFamily: "monospace", maxHeight: 380, overflowY: "auto" }}>{ros.final}</pre>}
                {tab === "agenda" && suite.agenda && <pre style={{ margin: 0, fontSize: 11, whiteSpace: "pre-wrap", fontFamily: "monospace", maxHeight: 380, overflowY: "auto" }}>{suite.agenda}</pre>}
                {tab === "survey" && suite.survey && <pre style={{ margin: 0, fontSize: 11, whiteSpace: "pre-wrap", fontFamily: "monospace", maxHeight: 380, overflowY: "auto" }}>{suite.survey}</pre>}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── INNOVATION LANDING ────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState("home");

      if (view === "pipeline") return (
        <div style={{ maxWidth: 740, margin: "0 auto", padding: 20 }}>
          <Pipeline onBack={() => setView("home")} />
        </div>
      );

      return (
        <div style={{ maxWidth: 860, margin: "0 auto", padding: "40px 20px" }}>

          <div style={{ textAlign: "center", paddingBottom: 40, borderBottom: "1px solid #e7e5e4", marginBottom: 40 }}>
            <div style={{ fontSize: 12, letterSpacing: 3, color: "#b45309", textTransform: "uppercase", fontWeight: 600, marginBottom: 12 }}>Innovation</div>
            <h1 style={{ margin: "0 0 24px", fontSize: 32, fontWeight: 300, color: "#1c1917", letterSpacing: "-0.5px" }}>AI-Powered Experiments</h1>
            <p className="innovation-intro" style={{ marginBottom: 16 }}>
              Field marketing is one of the most powerful growth levers in B2B GTM. When executed with precision, it drives attributable pipeline, accelerates demand generation, and deepens the customer relationships that fuel long-term revenue growth.
            </p>
            <p className="innovation-intro" style={{ marginBottom: 16 }}>
              It takes equal parts strategy, planning, creativity, and operational excellence to pull it off — from engaging the buying committee early, to converting prospects into customers, to expanding customer footprint, to owning that critical last mile that transforms pipeline into closed revenue.
            </p>
            <p className="innovation-intro" style={{ marginBottom: 16 }}>
              I'm building a suite of AI engines designed specifically for field marketers — so you can spend less time on operational heavy lifting and more time on what moves the number.
            </p>
            <p className="innovation-intro" style={{ fontStyle: "italic", color: "#b45309", fontWeight: 500 }}>
              This is just the beginning. Check back frequently — more engines are on the way.
            </p>
          </div>

          {/* FEATURED — Agentic Workforce Pipeline */}
          <div style={{ background: "#fff", border: "2px solid #e7e5e4", borderRadius: 16, overflow: "hidden", marginBottom: 24 }}>
            <div style={{ background: "#fef9f0", borderBottom: "1px solid #e7e5e4", padding: "28px 32px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                <span style={{ fontSize: 32 }}>🎯</span>
                <span style={{ background: "#b45309", color: "#fff", fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20, letterSpacing: 1, textTransform: "uppercase" }}>Featured</span>
              </div>
              <h2 style={{ margin: "0 0 6px", color: "#1c1917", fontSize: 22, fontWeight: 500 }}>Agentic Workforce Pipeline</h2>
              <p style={{ margin: 0, color: "#78716c", fontSize: 14 }}>3-Agent AI document generation system</p>
            </div>
            <div style={{ padding: "28px 32px" }}>
              <p className="featured-desc">
                Run of Show in one doc. Guest Agenda in another thread. Post-Event Survey an afterthought.<br/><br/>
                This 3-agent engine brings all three together — one input, three polished documents, in minutes. It doesn't replace your expertise — it gives you a strong starting point so you can focus on what matters most: the content, the relationships, the revenue.
              </p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 24 }} className="hero-grid">
                {[["🤖 Agent 1","Drafts the full Run of Show"],["🔍 Agent 2","Reviews & flags issues"],["✅ Agent 3","Validates & self-corrects"]].map(([title, desc]) => (
                  <div key={title} style={{ background: "#fafaf9", border: "1px solid #e7e5e4", borderRadius: 10, padding: "14px 16px" }}>

                ))}
              </div>
              <div style={{ marginBottom: 24 }}>
                {["Self-healing pipeline","Parallel execution","Zero API cost demo"].map(t => (
                  <span key={t} style={{ display: "inline-block", background: "#f5f5f4", color: "#57534e", border: "1px solid #e7e5e4", fontSize: 11, padding: "3px 10px", borderRadius: 20, marginRight: 6, marginBottom: 6, fontWeight: 500 }}>{t}</span>
                ))}
              </div>
              <button onClick={() => setView("pipeline")}
                style={{ padding: "12px 32px", background: "#b45309", color: "#fff", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: "pointer", width: "100%" }}>
                🚀 Launch Live Demo
              </button>
            </div>
          </div>

          {/* Secondary — Chatbot */}
          <div className="chatbot-card" style={{ background: "#fff", border: "1px solid #e7e5e4", borderRadius: 12, padding: "20px 24px", marginBottom: 32, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
              <span style={{ fontSize: 28 }}>🤖</span>
              <div>
                <h3 style={{ margin: 0, color: "#1c1917", fontSize: 16, fontWeight: 500 }}>AI Career Assistant</h3>
                <p style={{ margin: "4px 0 0", color: "#78716c", fontSize: 13 }}>Also on this site — a custom Claude-powered chatbot trained on my professional background. Ask it anything about my experience.</p>
              </div>
            </div>
            <a href="index.html" style={{ whiteSpace: "nowrap", padding: "10px 20px", background: "#fff", color: "#b45309", border: "2px solid #b45309", borderRadius: 8, fontSize: 13, fontWeight: 600, textDecoration: "none" }}>
              Try it →
            </a>
          </div>

          {/* Built With */}
          <div style={{ background: "#fff", border: "1px solid #e7e5e4", borderRadius: 12, padding: 24, textAlign: "center" }}>
            <div style={{ fontSize: 12, letterSpacing: 2, color: "#b45309", textTransform: "uppercase", fontWeight: 600, marginBottom: 16 }}>Built With</div>
            <div style={{ display: "flex", justifyContent: "center", gap: 10, flexWrap: "wrap" }}>
              {["Claude API (Anthropic)","React","Netlify Functions","JavaScript","HTML / CSS","Tailwind CSS"].map(t => (
                <span key={t} style={{ background: "#fafaf9", border: "1px solid #e7e5e4", color: "#44403c", fontSize: 12, padding: "5px 14px", borderRadius: 20, fontWeight: 500 }}>{t}</span>
              ))}
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
