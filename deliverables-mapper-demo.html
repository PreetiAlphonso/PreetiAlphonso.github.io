<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMMC — Engine 03: Deliverables Mapper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --color-text-primary: #1a1a17;
    --color-text-secondary: #6b6a64;
    --color-text-tertiary: #9b9a93;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f4ef;
    --color-background-info: #e6f1fb;
    --color-text-info: #185fa5;
    --color-border-info: #185fa5;
    --color-border-secondary: #c9c7bd;
    --color-border-tertiary: #e0ded6;
    --border-radius-md: 6px;
    --border-radius-lg: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-background-primary); font-family: var(--font-sans); }
  button { border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); border-radius: var(--border-radius-md); cursor: pointer; font-family: inherit; color: var(--color-text-primary); }
  input, select, textarea { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 8px; font-family: inherit; font-size: 13px; color: var(--color-text-primary); background: var(--color-background-primary); }
  table { border-collapse: collapse; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* FMMC house palette — consistent with Engine 02 (Shot Clock) */
const KEEP = { color: "#0F6E56", bg: "#E1F5EE", border: "#0F6E5640", glyph: "✓" };
const SKIP = { color: "#9A9A93", bg: "transparent", border: "var(--color-border-tertiary)", glyph: "✕" };

const SEED_CITIES = [
  { id: "c1", name: "City 1" },
  { id: "c2", name: "City 2" },
  { id: "vir", name: "Virtual" },
];

// One unified list of deliverables. scope: "perCity" (one per city) or "oneTime" (one build covers all).
const SEED_DELIVERABLES = [
  { id: "landing", name: "Landing Page", scope: "oneTime" },
  { id: "std", name: "Save the Date", scope: "oneTime" },
  { id: "inv", name: "Invite", scope: "perCity" },
  { id: "b1", name: "Booster 1", scope: "perCity" },
  { id: "b2", name: "Booster 2", scope: "perCity" },
  { id: "rem", name: "Reminder", scope: "perCity" },
  { id: "ty", name: "Thank You", scope: "oneTime" },
  { id: "swm", name: "Sorry We Missed You", scope: "oneTime" },
  { id: "ppt_s", name: "PPT One-Slide — Sales", scope: "oneTime" },
  { id: "ppt_m", name: "PPT One-Slide — Marketing", scope: "oneTime" },
  { id: "social", name: "Social / LinkedIn post", scope: "oneTime" },
  { id: "esig", name: "Electronic Signature", scope: "oneTime" },
  { id: "utm", name: "Tracking links (UTMs)", scope: "oneTime" },
  { id: "vip", name: "VIP Codes", scope: "oneTime" },
  { id: "video", name: "Promotional Video", scope: "oneTime" },
];

const ONE_KEY = "__one__";
const cellKey = (d, c) => d + ":" + c;

function App() {
  const [eventName, setEventName] = useState("");
  const [cities, setCities] = useState(SEED_CITIES);
  const [deliverables, setDeliverables] = useState(SEED_DELIVERABLES);
  const [cellState, setCellState] = useState({});       // perCity cells + oneTime rows -> "skip" when off
  const [citySkipped, setCitySkipped] = useState({});
  const [adder, setAdder] = useState(null);             // "deliverable" | "city" | null
  const [draft, setDraft] = useState("");

  const resetAll = () => {
    setEventName("");
    setCities(SEED_CITIES);
    setDeliverables(SEED_DELIVERABLES);
    setCellState({});
    setCitySkipped({});
    setAdder(null);
    setDraft("");
  };

  const getState = key => cellState[key] || "keep";
  const cycle = key => setCellState(p => ({ ...p, [key]: getState(key) === "keep" ? "skip" : "keep" }));

  /* ---- counts ---- */
  const isCityOn = id => !citySkipped[id];
  const ceiling = deliverables.length * cities.length; // naive: every deliverable, every city
  let built = 0, savedOneTime = 0, savedSkipped = 0;

  deliverables.forEach(d => {
    if (d.scope === "oneTime") {
      const s = getState(cellKey(d.id, ONE_KEY));
      if (s !== "skip") built += 1; else savedSkipped += 1;
      savedOneTime += cities.length - 1; // one build instead of one per city
    } else {
      cities.forEach(c => {
        const off = !isCityOn(c.id);
        const s = getState(cellKey(d.id, c.id));
        if (!off && s !== "skip") built += 1; else savedSkipped += 1;
      });
    }
  });

  const universe = ceiling;
  const buildTotal = built;
  const collapsed = universe - buildTotal;

  /* ---- mutations ---- */
  const renameCity = (id, name) => setCities(p => p.map(c => c.id === id ? { ...c, name } : c));
  const removeCity = id => setCities(p => p.length > 1 ? p.filter(c => c.id !== id) : p);
  const toggleCitySkip = id => setCitySkipped(p => ({ ...p, [id]: !p[id] }));
  const toggleScope = id => setDeliverables(p => p.map(d => d.id === id ? { ...d, scope: d.scope === "oneTime" ? "perCity" : "oneTime" } : d));
  const removeDeliverable = id => setDeliverables(p => p.length > 1 ? p.filter(d => d.id !== id) : p);

  const commitAdd = () => {
    const v = draft.trim();
    if (!v) { setAdder(null); return; }
    const id = "x" + Date.now();
    if (adder === "deliverable") setDeliverables(p => [...p, { id, name: v, scope: "oneTime" }]);
    if (adder === "city") setCities(p => [...p, { id, name: v }]);
    setDraft(""); setAdder(null);
  };

  const st = { fontFamily: "var(--font-sans)", color: "var(--color-text-primary)", fontSize: 14 };
  const pill = (bg, color) => ({ fontSize: 10, fontWeight: 500, padding: "1px 7px", borderRadius: 8, background: bg, color });

  return (
    <div style={{ ...st, padding: "1.25rem 1rem", maxWidth: 940, margin: "0 auto" }}>
      {/* Header */}
      <div style={{ marginBottom: "1rem" }}>
        <div style={{ fontSize: 10, fontWeight: 500, letterSpacing: "1px", textTransform: "uppercase", color: "var(--color-text-secondary)", marginBottom: 3 }}>FMMC · Field Marketing Mission Control</div>
        <h2 style={{ fontSize: 20, fontWeight: 500, margin: "0 0 2px" }}>Engine 03 — Deliverables Mapper</h2>
        <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "0 0 10px" }}>Land your scope before you build. Identify every deliverable you'll need before you make the ask from the marketing matrix — come prepared, and move faster together.</p>
        <div style={{ fontSize: 12, color: "#185FA5", background: "#E6F1FB", border: "0.5px solid #185FA540", borderRadius: "var(--border-radius-md)", padding: "8px 12px", marginBottom: 10 }}>
          This grid opens as a suggestion, not a mandate — the final number is yours.
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <label style={{ fontSize: 11, color: "var(--color-text-secondary)", flexShrink: 0 }}>Name your event</label>
          <input value={eventName} onChange={e => setEventName(e.target.value)} placeholder="e.g. Regional Security Summit"
            style={{ fontSize: 13, padding: "6px 10px", flex: 1, minWidth: 180, maxWidth: 320 }} />
          <button onClick={resetAll} title="Clear everything and start from the default grid"
            style={{ fontSize: 12, padding: "6px 12px", border: "0.5px solid var(--color-border-secondary)", background: "transparent", color: "var(--color-text-secondary)", borderRadius: "var(--border-radius-md)", cursor: "pointer", flexShrink: 0 }}>↺ Reset</button>
        </div>
      </div>

      {/* Hero count */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: "1.25rem" }}>
        <div style={{ flex: "1 1 180px", padding: "14px 16px", borderRadius: "var(--border-radius-lg)", background: "#EEEDFE", border: "0.5px solid #534AB740" }}>
          <div style={{ fontSize: 11, color: "#534AB7", marginBottom: 4 }}>Universe (everything possible)</div>
          <div style={{ fontSize: 30, fontWeight: 500, color: "#534AB7", lineHeight: 1 }}>{universe}</div>
          <div style={{ fontSize: 10, color: "#26215C", opacity: 0.7, marginTop: 4 }}>every deliverable × every city</div>
        </div>
        <div style={{ flex: "1 1 180px", padding: "14px 16px", borderRadius: "var(--border-radius-lg)", background: "#E1F5EE", border: "0.5px solid #0F6E5640" }}>
          <div style={{ fontSize: 11, color: "#0F6E56", marginBottom: 4 }}>Build list{eventName ? " · " + eventName : ""}</div>
          <div style={{ fontSize: 30, fontWeight: 500, color: "#0F6E56", lineHeight: 1 }}>{buildTotal}</div>
          <div style={{ fontSize: 10, color: "#04342C", opacity: 0.75, marginTop: 4 }}>what you'll actually request</div>
        </div>
        <div style={{ flex: "2 1 260px", padding: "14px 16px", borderRadius: "var(--border-radius-lg)", background: "var(--color-background-secondary)", border: "0.5px solid var(--color-border-tertiary)" }}>
          <div style={{ fontSize: 11, color: "var(--color-text-secondary)", marginBottom: 6 }}>{collapsed} collapsed — the gap you take to the room</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 3, fontSize: 11 }}>
            <span><strong style={{ fontWeight: 500, color: "#185FA5" }}>{savedOneTime}</strong> from shared deliverables (one build, not one per city)</span>
            <span><strong style={{ fontWeight: 500, color: "#185FA5" }}>{savedSkipped}</strong> skipped by you</span>
          </div>
        </div>
      </div>

      {/* Legend */}
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 10, fontSize: 11, color: "var(--color-text-secondary)", alignItems: "center" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ width: 16, height: 16, borderRadius: 4, background: KEEP.bg, border: "0.5px solid " + KEEP.border, color: KEEP.color, fontSize: 9, display: "flex", alignItems: "center", justifyContent: "center" }}>{KEEP.glyph}</span>
          Keep
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ width: 16, height: 16, borderRadius: 4, background: SKIP.bg, border: "0.5px solid " + SKIP.border, color: SKIP.color, fontSize: 9, display: "flex", alignItems: "center", justifyContent: "center" }}>{SKIP.glyph}</span>
          Skip
        </span>
        <span style={{ marginLeft: "auto", fontStyle: "italic" }}>Each row is a deliverable you'll request from another team. You scope it here; they build it.</span>
      </div>

      {/* Grid */}
      <div style={{ overflowX: "auto", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", marginBottom: "1.25rem" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 560 }}>
          <thead>
            <tr>
              <th style={{ textAlign: "left", padding: "10px 12px", fontSize: 11, fontWeight: 500, color: "var(--color-text-secondary)", borderBottom: "0.5px solid var(--color-border-tertiary)", position: "sticky", left: 0, background: "var(--color-background-primary)", minWidth: 170 }}>Deliverable</th>
              {cities.map(c => {
                const off = !isCityOn(c.id);
                return (
                  <th key={c.id} style={{ padding: "8px 10px", borderBottom: "0.5px solid var(--color-border-tertiary)", minWidth: 100, opacity: off ? 0.5 : 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 2, justifyContent: "center" }}>
                      <input value={c.name} onChange={e => renameCity(c.id, e.target.value)} title="Rename city"
                        style={{ fontSize: 12, fontWeight: 500, textAlign: "center", width: 66, padding: "2px 4px", border: "0.5px solid transparent", borderRadius: 4, background: "transparent", color: "var(--color-text-primary)", textDecoration: off ? "line-through" : "none" }}
                        onFocus={e => e.target.style.border = "0.5px solid var(--color-border-secondary)"}
                        onBlur={e => e.target.style.border = "0.5px solid transparent"} />
                      <button onClick={() => removeCity(c.id)} title="Delete city permanently"
                        style={{ border: "none", background: "transparent", color: "var(--color-text-secondary)", cursor: "pointer", fontSize: 12, lineHeight: 1, padding: 2 }}>×</button>
                    </div>
                    <button onClick={() => toggleCitySkip(c.id)} title={off ? "Restore this city" : "Skip this city (reversible)"}
                      style={{ marginTop: 3, ...pill(off ? "#E1F5EE" : "var(--color-background-secondary)", off ? "#0F6E56" : "var(--color-text-secondary)"), border: "none", cursor: "pointer" }}>
                      {off ? "restore" : "skip"}
                    </button>
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {deliverables.map(d => (
              <tr key={d.id}>
                <td style={{ padding: "8px 12px", borderBottom: "0.5px solid var(--color-border-tertiary)", position: "sticky", left: 0, background: "var(--color-background-primary)" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <span style={{ fontSize: 12, fontWeight: 500 }}>{d.name}</span>
                    <button onClick={() => removeDeliverable(d.id)} title="Remove this deliverable"
                      style={{ border: "none", background: "transparent", color: "var(--color-text-secondary)", cursor: "pointer", fontSize: 12, lineHeight: 1, padding: 2 }}>×</button>
                  </div>
                  <button onClick={() => toggleScope(d.id)} title="Switch shared / split"
                    style={{ marginTop: 3, ...pill(d.scope === "oneTime" ? "#E6F1FB" : "var(--color-background-secondary)", d.scope === "oneTime" ? "#185FA5" : "var(--color-text-secondary)"), border: "none", cursor: "pointer" }}>
                    {d.scope === "oneTime" ? "shared · one for all" : "split · per city"}
                  </button>
                </td>
                {d.scope === "oneTime" ? (
                  <td colSpan={cities.length} style={{ padding: 6, borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                    {(() => {
                      const key = cellKey(d.id, ONE_KEY);
                      const s = getState(key) === "skip" ? SKIP : KEEP;
                      return (
                        <div onClick={() => cycle(key)} style={{ cursor: "pointer", textAlign: "center", padding: "8px 10px", borderRadius: "var(--border-radius-md)", background: s.bg, border: "0.5px dashed " + s.border, color: s.color, fontSize: 11, fontWeight: 500 }}>
                          {s.glyph} one build — covers every city
                        </div>
                      );
                    })()}
                  </td>
                ) : (
                  cities.map(c => {
                    const off = !isCityOn(c.id);
                    const key = cellKey(d.id, c.id);
                    const s = (off || getState(key) === "skip") ? SKIP : KEEP;
                    return (
                      <td key={c.id} style={{ padding: 6, borderBottom: "0.5px solid var(--color-border-tertiary)", opacity: off ? 0.4 : 1 }}>
                        <div onClick={() => { if (!off) cycle(key); }} style={{ cursor: off ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", height: 30, borderRadius: "var(--border-radius-md)", background: s.bg, border: "0.5px solid " + s.border, color: s.color, fontSize: 12, fontWeight: 500 }}>
                          {s.glyph}
                        </div>
                      </td>
                    );
                  })
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Add deliverable / city */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: "1.5rem" }}>
        {adder === "deliverable" || adder === "city" ? (
          <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
            <input autoFocus value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => { if (e.key === "Enter") commitAdd(); }}
              placeholder={adder === "deliverable" ? "New deliverable name…" : "New city name…"} style={{ fontSize: 12, padding: "6px 10px" }} />
            <button onClick={commitAdd} style={{ fontSize: 12, padding: "6px 12px", background: "#185FA5", color: "#fff", border: "none", borderRadius: "var(--border-radius-md)", cursor: "pointer", fontWeight: 500 }}>Add</button>
            <button onClick={() => { setAdder(null); setDraft(""); }} style={{ fontSize: 12, padding: "6px 12px" }}>Cancel</button>
          </div>
        ) : (
          <React.Fragment>
            <button onClick={() => setAdder("deliverable")} style={{ fontSize: 12, padding: "6px 12px" }}>+ Add deliverable</button>
            <button onClick={() => setAdder("city")} style={{ fontSize: 12, padding: "6px 12px" }}>+ Add city</button>
          </React.Fragment>
        )}
      </div>

      <div style={{ marginTop: "0.5rem", paddingTop: 12, borderTop: "0.5px solid var(--color-border-tertiary)", fontSize: 11, color: "var(--color-text-secondary)", lineHeight: 1.6 }}>
        How to scope: set each deliverable to <strong style={{ fontWeight: 500 }}>shared</strong> (a single build that covers every city) or <strong style={{ fontWeight: 500 }}>split</strong> (one build for each city). Skip anything you don't need, add cities for a roadshow, or add your own deliverables. The number you land on is exactly what you'll request — nothing more, nothing missed.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
